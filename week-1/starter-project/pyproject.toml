[project]
name = "incidentops-starter"
version = "0.1.0"
description = "Proyecto semilla IncidentOps para Semana 1 de Ingeniería de Software Asistida por IA (ISIA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi" = { msg = "La entrega HTTP vive en src/adapters/inbound/ (ADR-003)." }
"pydantic" = { msg = "Los esquemas viven en src/adapters/inbound/api/ (ADR-003)." }
"typer" = { msg = "La CLI vive en src/adapters/inbound/ (ADR-003)." }
"sqlite3" = { msg = "La persistencia vive en src/adapters/outbound/ (ADR-001)." }
"sqlalchemy" = { msg = "No se usan ORMs pesados según ADR-001." }
"src.application" = { msg = "El dominio no puede depender de la aplicación (ADR-003)." }
"src.adapters" = { msg = "El dominio no puede depender de los adaptadores (ADR-003)." }

[tool.ruff.lint.per-file-ignores]
"src/incident_repository.py" = ["TID251"]
"tests/**" = ["TID251"]
